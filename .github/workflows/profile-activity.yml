name: Update profile activity

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - .github/workflows/profile-activity.yml

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Refresh public contribution graphics
        run: |
          git pull --ff-only origin main
          python3 scripts/update_activity.py
      - name: Publish updated graphics
        run: |
          git add assets/hero.svg assets/hero-compact.svg assets/activity.svg assets/activity-compact.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public contribution activity'
          git push origin HEAD:main
